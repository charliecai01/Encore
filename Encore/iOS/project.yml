name: EncoreiOS
options:
  bundleIdPrefix: dev.charlie
  deploymentTarget:
    iOS: "17.0"
packages:
  Encore:
    path: ..
targets:
  EncoreiOS:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: Encore
        product: EncoreCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Encore
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1.0.0"
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        # All orientations declared; AppDelegate.orientationMask keeps the app
        # portrait everywhere except the podcast video screen (landscape).
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Phone
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).PhoneSceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.charlie.encore.ios
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
